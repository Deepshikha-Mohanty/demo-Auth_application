spring.application.name=AuthApp
spring.datasource.url=jdbc:mysql://localhost:3306/database_name
spring.datasource.username=mysql_username
spring.datasource.password=mysql_password
spring.jpa.show-aql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.oauth2.client.registration.gluu.client-id=client_id
spring.security.oauth2.client.registration.gluu.client-secret=client_secret
spring.security.oauth2.client.registration.gluu.scope=openid,profile,email,phone
spring.security.oauth2.client.registration.gluu.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gluu.redirect-uri=http://localhost:8080/login/oauth2/code/gluu

spring.security.oauth2.client.provider.gluu.issuer-uri=https://sso.cnxy.in
spring.security.oauth2.client.provider.cnxy.authorization-uri=https://sso.cnxy.in/oxauth/restv1/authorize
spring.security.oauth2.client.provider.cnxy.token-uri=https://sso.cnxy.in/oxauth/restv1/token
spring.security.oauth2.client.provider.cnxy.jwk-set-uri=https://sso.cnxy.in/oxauth/restv1/jwks
spring.security.oauth2.client.provider.cnxy.user-info-uri=https://sso.cnxy.in/oxauth/restv1/userinfo
spring.security.oauth2.client.provider.cnxy.user-name-attribute=sub
